<script>
  (function () {
    function showErr(msg) {
      var el = document.getElementById("boot-error");
      var m = document.getElementById("boot-error-msg");
      if (el && m) { m.textContent = String(msg); el.style.display = "block"; }
    }
    window.addEventListener("error", function (e) { showErr((e.error && (e.error.stack || e.error.message)) || e.message || "Unknown error"); });

  })();

<!-- Load Firebase as a real ES module so dynamic import() is not parsed by Babel -->
<script type="module">
  (async () => {
    try {
      const [appM, authM, fsM, stM] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"),
      ]);
      window.__FB_SDK__ = { app: appM, auth: authM, fs: fsM, st: stM };
    } catch (err) {
      window.__FB_SDK_ERROR__ = err && (err.message || String(err)) || "Failed to load Firebase SDK";
    } finally {
      window.dispatchEvent(new Event("fb-sdk-ready"));
    }
  })();
</script>

// ─── Firebase CDN loader (reads SDK preloaded by the module script above) ─────
let _fb = null;
function _waitForSdk() {
  return new Promise((resolve, reject) => {
    function check() {
      if (window.__FB_SDK_ERROR__) return reject(new Error(window.__FB_SDK_ERROR__));
      if (window.__FB_SDK__) return resolve(window.__FB_SDK__);
      return null;
    }
    const immediate = check();
    if (immediate !== null) return;
    window.addEventListener("fb-sdk-ready", () => {
      if (window.__FB_SDK_ERROR__) reject(new Error(window.__FB_SDK_ERROR__));
      else resolve(window.__FB_SDK__);
    }, { once: true });
    // Safety timeout
    setTimeout(() => {
      if (!window.__FB_SDK__ && !window.__FB_SDK_ERROR__) {
        reject(new Error("Timed out loading Firebase SDK. Check your internet connection or try opening this file from a web server (http/https) instead of a local content:// URL."));
      }
    }, 20000);
  });
}
async function loadFirebase(cfg) {
  if (_fb) return _fb;
  const sdk = await _waitForSdk();
  const { initializeApp, getApps, getApp } = sdk.app;
  const { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } = sdk.auth;
  const { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp, updateDoc, deleteDoc } = sdk.fs;
  const { getStorage, ref, uploadBytes, getDownloadURL } = sdk.st;
  const app = getApps().length ? getApp() : initializeApp(cfg);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  _fb = {
    app, auth, db, storage,
    register: (email, pw) => createUserWithEmailAndPassword(auth, email, pw),
    login: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
    logout: () => signOut(auth),
    updateProfile: (u, d) => updateProfile(u, d),
    onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
    setDoc, getDoc, doc, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp, updateDoc, deleteDoc,
    ref, uploadBytes, getDownloadURL,
  };
  return _fb;
}

// ─── Auth Page ─────────────────────────────────────────────────────────────────
const AuthPage = ({ mode, setPage, fb, onAuth, showToast }) => {
  const [form, setForm] = useState({ name:"", email:"", password:"", confirm:"" });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const set = k => e => setForm(p => ({ ...p, [k]:e.target.value }));

  const submit = async () => {
    setErr(""); setLoading(true);
    try {
      if (mode === "register") {
        if (form.password !== form.confirm) throw new Error("Passwords don't match.");
        if (form.password.length < 6) throw new Error("Password must be at least 6 characters.");
        const cred = await fb.register(form.email, form.password);
        await fb.updateProfile(cred.user, { displayName: form.name });
        await fb.setDoc(fb.doc(fb.db, "users", cred.user.uid), {
          displayName:form.name, email:form.email,
          createdAt:fb.serverTimestamp(), credits:0, plan:"free", totalGenerations:0,
        });
        showToast("Account created! Welcome to ProofIT.");
        onAuth(cred.user);
      } else {
        const cred = await fb.login(form.email, form.password);
        showToast("Welcome back!");
        onAuth(cred.user);
      }
      setPage("dashboard");
    } catch (e) {
      const msgs = {
        "auth/email-already-in-use":"Email already in use.",
        "auth/invalid-email":"Invalid email address.",
        "auth/wrong-password":"Incorrect password.",
        "auth/user-not-found":"No account found with this email.",
        "auth/invalid-credential":"Invalid email or password.",
        "auth/too-many-requests":"Too many attempts. Try again later.",
      };
      setErr(msgs[e.code] || e.message);
    }
    setLoading(false);
  };

  return (
    <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 24px 40px" }}>
      <Glass style={{ width:"100%",maxWidth:420,padding:40 }}>
        <div style={{ textAlign:"center",marginBottom:28 }}>
          <div style={{ width:50,height:50,borderRadius:14,background:"linear-gradient(135deg,#2563EB,#3B82F6)",
            display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px" }}>
            <Icon d={IC.file} size={24} stroke="white" />
          </div>
          <h2 style={{ fontFamily:"'Sora',sans-serif",fontSize:22,fontWeight:800,color:"#fff",margin:"0 0 5px" }}>
            {mode==="login"?"Welcome back":"Create account"}
          </h2>
          <p style={{ color:"#9CA3AF",fontSize:13,margin:0 }}>
            {mode==="login"?"Sign in to your ProofIT account":"Start generating documents today"}
          </p>
        </div>
        <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
          {mode==="register" && <Input label="Full Name" placeholder="John Doe" value={form.name} onChange={set("name")} />}
          <Input label="Email" type="email" placeholder="you@example.com" value={form.email} onChange={set("email")} />
          <Input label="Password" type="password" placeholder="••••••••" value={form.password} onChange={set("password")} />
          {mode==="register" && <Input label="Confirm Password" type="password" placeholder="••••••••" value={form.confirm} onChange={set("confirm")} />}
          {mode==="login" && (
            <div style={{ display:"flex",justifyContent:"flex-end" }}>
              <button style={{ background:"none",border:"none",color:C.accent2,fontSize:13,cursor:"pointer" }}>Forgot password?</button>
            </div>
          )}
          {err && (
            <div style={{ background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.25)",
              borderRadius:8,padding:"10px 14px",color:"#FCA5A5",fontSize:13,display:"flex",gap:8,alignItems:"center" }}>
              <Icon d={IC.alertCircle} size={15} stroke="#F87171" /> {err}
            </div>
          )}
          <Btn variant="primary" onClick={submit} disabled={loading}
            style={{ justifyContent:"center",padding:"13px 24px",fontSize:15,marginTop:4 }}>
            {loading ? <><Spinner size={17} /> Please wait…</> : mode==="login"?"Sign In":"Create Account"}
          </Btn>
        </div>
        <p style={{ textAlign:"center",color:"#9CA3AF",fontSize:13,marginTop:22 }}>
          {mode==="login"?"Don't have an account? ":"Already have an account? "}
          <button onClick={() => setPage(mode==="login"?"register":"login")}
            style={{ background:"none",border:"none",color:C.accent2,cursor:"pointer",fontSize:13,fontWeight:600 }}>
            {mode==="login"?"Create account":"Sign in"}
          </button>
        </p>
      </Glass>
    </div>
  );
};

const Dashboard = ({ setPage, setSelectedTemplate, authUser, fb, showToast }) => {
  const [tab, setTab] = useState("home");
  const [sideOpen, setSideOpen] = useState(false);
  const [userDoc, setUserDoc] = useState(null);
  const [history, setHistory] = useState([]);
  const [loadingHistory, setLoadingHistory] = useState(false);
  const [profileForm, setProfileForm] = useState({ displayName:"", email:"" });
  const [savingProfile, setSavingProfile] = useState(false);

  useEffect(() => {
    if (!authUser || !fb) return;
    fb.getDoc(fb.doc(fb.db,"users",authUser.uid)).then(snap => {
      if (snap.exists()) setUserDoc(snap.data());
      else setUserDoc({ displayName:authUser.displayName, email:authUser.email, credits:0, plan:"free", totalGenerations:0 });
    });
    setProfileForm({ displayName:authUser.displayName||"", email:authUser.email||"" });
  }, [authUser, fb]);

  const loadHistory = useCallback(async () => {
    if (!authUser || !fb) return;
    setLoadingHistory(true);
    try {
      const q = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid),fb.orderBy("createdAt","desc"));
      const snap = await fb.getDocs(q);
      setHistory(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    } catch {
      try {
        const q2 = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid));
        const snap2 = await fb.getDocs(q2);
        setHistory(snap2.docs.map(d => ({ id:d.id,...d.data() })).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
      } catch { setHistory([]); }
    }
    setLoadingHistory(false);
  }, [authUser, fb]);

  useEffect(() => { if (tab==="history") loadHistory(); }, [tab, loadHistory]);

  const saveProfile = async () => {
    setSavingProfile(true);
    try {
      await fb.updateProfile(authUser, { displayName:profileForm.displayName });
      await fb.setDoc(fb.doc(fb.db,"users",authUser.uid),{ displayName:profileForm.displayName },{ merge:true });
      setUserDoc(p => ({ ...p, displayName:profileForm.displayName }));

    setSavingProfile(false);

// ─── Template Detail ───────────────────────────────────────────────────────────
const TemplateDetail = ({ template, setPage, authUser, fb, showToast }) => {
  const fields = getFields(template?.id);
  const [formData, setFormData] = useState({});
  const [photoPreview, setPhotoPreview] = useState(null);
  const [sigPreview, setSigPreview] = useState(null);
  const [photoFile, setPhotoFile] = useState(null);
  const [sigFile, setSigFile] = useState(null);
  const [generating, setGenerating] = useState(false);

  const handleFile = (e, setPreview, setFile) => {
    const file = e.target.files[0];
    if (!file) return;
    setFile(file);
    const r = new FileReader(); r.onload = ev => setPreview(ev.target.result); r.readAsDataURL(file);
  };

  const generate = async () => {
    setGenerating(true);
    try {
      let photoURL = null, sigURL = null;
      if (photoFile && fb.storage) {
        try {
          const photoRef = fb.ref(fb.storage,`generations/${authUser.uid}/${Date.now()}_photo`);
          await fb.uploadBytes(photoRef, photoFile);
          photoURL = await fb.getDownloadURL(photoRef);
        } catch {}
      }
      if (sigFile && fb.storage) {
        try {
          const sigRef = fb.ref(fb.storage,`generations/${authUser.uid}/${Date.now()}_sig`);
          await fb.uploadBytes(sigRef, sigFile);
          sigURL = await fb.getDownloadURL(sigRef);
        } catch {}
      }
      await fb.addDoc(fb.collection(fb.db,"generations"), {
        userId:authUser.uid, templateId:template.id, templateName:template.name,
        templateCategory:template.category, formData:{...formData},
        photoURL, sigURL, purchased:false, createdAt:fb.serverTimestamp(),
      });
      const uSnap = await fb.getDoc(fb.doc(fb.db,"users",authUser.uid));
      await fb.setDoc(fb.doc(fb.db,"users",authUser.uid),
        { totalGenerations:(uSnap.data()?.totalGenerations||0)+1 },{ merge:true }
      );
      showToast("Document generated! Redirecting to preview…");
      setTimeout(() => setPage("generated"), 800);
    } catch (e) { showToast("Generation failed: "+e.message,"error"); }
    setGenerating(false);
  };

  return (
    <div style={{ minHeight:"100vh",paddingTop:80,padding:"80px 24px 60px" }}>
      <div style={{ maxWidth:1060,margin:"0 auto" }}>
        <button onClick={()=>setPage("dashboard")} style={{ background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6,marginBottom:24 }}>
          ← Back to Templates
        </button>
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,alignItems:"start" }} className="td-grid">
          <style>{`@media(max-width:768px){.td-grid{grid-template-columns:1fr!important}}`}</style>

          <Glass style={{ padding:28,position:"sticky",top:84 }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18 }}>
              <h2 style={{ fontFamily:"'Sora',sans-serif",fontSize:17,fontWeight:800,color:"#fff",margin:0 }}>{template?.name}</h2>
              <Badge color={template?.color||C.accent2}>{template?.category}</Badge>
            </div>
            <div style={{ background:`linear-gradient(135deg,${template?.color||"#3B82F6"}10,${template?.color||"#3B82F6"}04)`,
              border:`1px solid ${template?.color||"#3B82F6"}22`,borderRadius:12,padding:24,minHeight:280,position:"relative",overflow:"hidden" }}>
              <div style={{ position:"absolute",inset:0,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:20,opacity:0.05,transform:"rotate(-30deg)",pointerEvents:"none",userSelect:"none" }}>
                {[0,1,2,3].map(i=><div key={i} style={{ fontSize:16,fontWeight:900,color:"#fff",letterSpacing:"0.15em",whiteSpace:"nowrap" }}>★ PREVIEW ONLY ★</div>)}
              </div>
              <div style={{ fontSize:10,fontWeight:700,color:template?.color||C.accent2,letterSpacing:"0.14em",marginBottom:10 }}>
                {template?.name?.toUpperCase()}
              </div>
              <div style={{ display:"flex",gap:14,marginBottom:14 }}>
                <div style={{ width:60,height:75,borderRadius:6,background:"rgba(255,255,255,0.05)",border:"1px dashed rgba(255,255,255,0.12)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0 }}>
                  {photoPreview?<img src={photoPreview} style={{ width:"100%",height:"100%",objectFit:"cover" }}/>:<Icon d={IC.user} size={26} stroke="rgba(255,255,255,0.18)"/>}
                </div>
                <div style={{ flex:1,display:"flex",flexDirection:"column",gap:7 }}>
                  {["fullName","dob","address","idNumber"].map(k=>(
                    <div key={k}>
                      <div style={{ height:7,borderRadius:3,background:formData[k]?"rgba(255,255,255,0.18)":"rgba(255,255,255,0.05)",width:formData[k]?"90%":"60%",marginBottom:2,transition:"all .3s" }} />
                      {formData[k] && <div style={{ fontSize:9,color:"rgba(255,255,255,0.55)",fontFamily:"monospace" }}>{formData[k]}</div>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </Glass>

          <Glass style={{ padding:28 }}>
            <h2 style={{ fontFamily:"'Sora',sans-serif",fontSize:17,fontWeight:800,color:"#fff",margin:"0 0 22px" }}>Document Details</h2>
            <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
              {fields.map(field => (
                <div key={field.id}>
                  {(field.type==="text"||field.type==="date") && (
                    <Input label={field.label} type={field.type} placeholder={field.placeholder}
                      value={formData[field.id]||""} onChange={e=>setFormData(p=>({...p,[field.id]:e.target.value}))} />
                  )}
                  {field.type==="select" && (
                    <Input label={field.label} type="select" options={field.options}
                      value={formData[field.id]||""} onChange={e=>setFormData(p=>({...p,[field.id]:e.target.value}))} />
                  )}
                  {field.type==="photo" && (
                    <div>
                      <div style={{ fontSize:12,fontWeight:600,color:C.muted,marginBottom:7 }}>{field.label}</div>
                      <div style={{ display:"flex",gap:10,alignItems:"center" }}>
                        <div style={{ width:56,height:68,borderRadius:7,background:"rgba(255,255,255,0.04)",border:"1px dashed rgba(255,255,255,0.13)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0 }}>
                          {photoPreview?<img src={photoPreview} style={{ width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon d={IC.camera} size={18} stroke={C.dim}/>}
                        </div>
                        <label style={{ flex:1,background:"rgba(255,255,255,0.03)",border:"1px dashed rgba(255,255,255,0.12)",borderRadius:9,padding:"13px",textAlign:"center",cursor:"pointer",display:"block" }}>
                          <Icon d={IC.upload} size={16} stroke={C.accent2}/>
                          <div style={{ fontSize:11,color:C.dim,marginTop:5 }}>Click to upload photo</div>
                          <input type="file" accept="image/*" style={{ display:"none" }} onChange={e=>handleFile(e,setPhotoPreview,setPhotoFile)}/>
                        </label>
                      </div>
                    </div>
                  )}
                  {field.type==="signature" && (
                    <div>
                      <div style={{ fontSize:12,fontWeight:600,color:C.muted,marginBottom:7 }}>{field.label}</div>
                      <label style={{ background:"rgba(255,255,255,0.03)",border:"1px dashed rgba(255,255,255,0.12)",borderRadius:9,padding:"13px",textAlign:"center",cursor:"pointer",display:"block" }}>
                        {sigPreview?<img src={sigPreview} style={{ maxHeight:44,objectFit:"contain"}}/>:(
                          <><Icon d={IC.upload} size={16} stroke={C.dim}/><div style={{ fontSize:11,color:C.dim,marginTop:5 }}>Upload signature image</div></>
                        )}
                        <input type="file" accept="image/*" style={{ display:"none" }} onChange={e=>handleFile(e,setSigPreview,setSigFile)}/>
                      </label>
                    </div>
                  )}
                </div>
              ))}
              <Btn variant="primary" onClick={generate} disabled={generating}
                style={{ marginTop:10,justifyContent:"center",padding:"13px 22px",fontSize:15 }}>
                {generating?<><Spinner size={17}/> Saving to Firebase…</>:<><Icon d={IC.zap} size={18}/> Generate Document</>}
              </Btn>
            </div>
          </Glass>
        </div>
      </div>
    </div>
  );
};

      const q = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid),fb.where("templateId","==",template.id));

      const latest = snap.docs.sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0))[0];

                  <td style={{ padding:"11px 16px" }}><Badge color={t.color}>{t.category}</Badge></td>
                  <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{getFields(t.id).length}</td>
                  <td style={{ padding:"11px 16px" }}><Badge color="#10B981">Active</Badge></td>
                </tr>
              ))}</tbody>
            </table>
          </Glass>
        )}
        {!loading && section==="users" && (
          users.length===0 ? (
            <Glass style={{ padding:32,textAlign:"center" }}><p style={{ color:C.dim,fontSize:14 }}>No users in Firestore yet.</p></Glass>
          ) : (
            <Glass style={{ padding:0,overflow:"hidden" }}>
              <table style={{ width:"100%",borderCollapse:"collapse" }}>
                <thead><tr style={{ borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
                  {["Name","Email","Plan","Generations","Joined"].map(h=>(
                    <th key={h} style={{ padding:"12px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>{users.map(u=>(
                  <tr key={u.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{u.displayName||"—"}</td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{u.email}</td>
                    <td style={{ padding:"11px 16px" }}><Badge color={C.accent2}>{u.plan||"free"}</Badge></td>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{u.totalGenerations||0}</td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{u.createdAt?.seconds?new Date(u.createdAt.seconds*1000).toLocaleDateString():"—"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </Glass>
          )
        )}
        {!loading && section==="orders" && (
          gens.length===0 ? (
            <Glass style={{ padding:32,textAlign:"center" }}><p style={{ color:C.dim,fontSize:14 }}>No orders yet.</p></Glass>
          ) : (
            <Glass style={{ padding:0,overflow:"hidden" }}>
              <table style={{ width:"100%",borderCollapse:"collapse" }}>
                <thead><tr style={{ borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
                  {["Document","User ID","Status","Date"].map(h=>(
                    <th key={h} style={{ padding:"12px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>{gens.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(g=>(
                  <tr key={g.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{g.templateName||"—"}</td>
                    <td style={{ padding:"11px 16px",fontSize:11,color:C.dim,fontFamily:"monospace" }}>{g.userId?.slice(0,12)}…</td>
                    <td style={{ padding:"11px 16px" }}><Badge color={g.purchased?"#10B981":"#F59E0B"}>{g.purchased?"Purchased":"Preview"}</Badge></td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{g.createdAt?.seconds?new Date(g.createdAt.seconds*1000).toLocaleDateString():"—"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </Glass>
          )
        )}
      </div>
    </div>
  );
};

// ─── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const [fb, setFb] = useState(null);
  const [fbReady, setFbReady] = useState(false);
  const [fbError, setFbError] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [page, setPage] = useState("landing");
  const [selectedTemplate, setSelectedTemplate] = useState(null);
  const [toast, setToast] = useState(null);

  // Auto-connect with hardcoded config
  useEffect(() => {
    loadFirebase(FIREBASE_CONFIG).then(instance => {
      setFb(instance);
      setFbReady(true);
      instance.onAuthStateChanged(u => { setAuthUser(u); setAuthLoading(false); });
    }).catch(e => {
      setFbError(e.message || "Unknown error");
      setAuthLoading(false);
    });
  }, []);

  const showToast = (msg, type="success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const logout = async () => {
    await fb?.logout();
    setAuthUser(null); setPage("landing");
    showToast("Signed out.", "warning");
  };

  const navSetPage = (p) => {
    if ((p==="dashboard"||p==="template-detail"||p==="generated"||p==="admin") && !authUser) {
      setPage("login"); return;
    }
    setPage(p);
  };

  if (!fbReady) return <LoadingScreen error={fbError} />;
  if (authLoading) return (
    <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg0 }}>
      <Spinner size={40} />
    </div>
  );

  const pageProps = { fb, authUser, showToast, setPage:navSetPage };

  return (
    <div style={{ minHeight:"100vh", background:`linear-gradient(160deg,${C.bg0} 0%,${C.bg1} 50%,${C.bg0} 100%)`,
      color:"#fff", fontFamily:"'Sora',system-ui,sans-serif", position:"relative" }}>
      <AnimBg />
      <div style={{ position:"relative", zIndex:1 }}>
        <Nav page={page} setPage={navSetPage} authUser={authUser} onLogout={logout} />
        {page==="landing" && <Landing setPage={navSetPage} />}
        {page==="login" && <AuthPage mode="login" {...pageProps} onAuth={setAuthUser} />}
        {page==="register" && <AuthPage mode="register" {...pageProps} onAuth={setAuthUser} />}
        {page==="dashboard" && <Dashboard {...pageProps} setSelectedTemplate={setSelectedTemplate} />}
        {page==="template-detail" && <TemplateDetail template={selectedTemplate} {...pageProps} />}
        {page==="generated" && <GeneratedPreview template={selectedTemplate} {...pageProps} />}
        {page==="admin" && <AdminPanel {...pageProps} />}
      </div>
      {authUser && (
        <button onClick={()=>navSetPage("admin")} title="Admin Panel"
          style={{ position:"fixed",bottom:20,right:20,width:36,height:36,borderRadius:"50%",
            background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.2)",
            cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:99 }}>
          <Icon d={IC.settings} size={16} stroke="#F87171" />
        </button>
      )}
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
