<script>

<script type="module">

        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"),
      ]);
      window.__FB_SDK__ = { app: appM, auth: authM, fs: fsM, st: stM };
    } catch (err) {
      window.__FB_SDK_ERROR__ = err && (err.message || String(err)) || "Failed to load Firebase SDK";
    } finally {
      window.dispatchEvent(new Event("fb-sdk-ready"));
    }
  })();
</script>

function _waitForSdk() {

async function loadFirebase(cfg) {
  if (_fb) return _fb;
  const sdk = await _waitForSdk();
  const { initializeApp, getApps, getApp } = sdk.app;

const GEMINI_KEY_STORAGE  = "proofIT_gemini_key";
const CLAUDE_KEY_STORAGE  = "proofIT_anthropic_key";
const getGeminiKey = () => localStorage.getItem(GEMINI_KEY_STORAGE) || "";
const getClaudeKey = () => localStorage.getItem(CLAUDE_KEY_STORAGE) || "";
const setGeminiKey = (k) => localStorage.setItem(GEMINI_KEY_STORAGE, k.trim());
const setClaudeKey = (k) => localStorage.setItem(CLAUDE_KEY_STORAGE, k.trim());

// Shared vision prompt used by both providers
const DETECT_SYSTEM_PROMPT = `You are an expert document layout analyzer. Locate every personal data field in a document image — whether blank OR already filled with sample data — and return the exact bounding box so a personalization overlay can be placed on top.

KEY INSIGHT: The image may be a FILLED example document (e.g. a real driver license showing a real person's name, photo, DOB, address). That is PERFECT — read the existing values to understand what each field IS and WHERE it lives. Return the bounding box so new user data can be overlaid in the same spot.

WHAT TO DETECT: Full name / First name / Last name, dates (DOB/Expiry/Issue), ID/License number, Address/City/State/ZIP, portrait photo area (even if photo already there), signature area, thumbnail photo, Sex/Eye Color/Hair Color/Height/Weight/Blood Type, Class/Restrictions/Endorsements, and any personal info unique to each individual.

WHAT TO SKIP: Pre-printed static labels ("Date of Birth:", "4d. DL:", "DRIVER LICENSE" title, state name, decorative text), borders, watermarks, seals, logos, background patterns.

POSITION RULES: All positions as fractions 0.0–1.0 of image pixel dimensions. x,y = TOP-LEFT of the VALUE area (exclude the label). w,h = size of the value region. Be precise — overlay must land exactly where existing data sits.

FIELD TYPES:
- "photo" — portrait or thumbnail photo area
- "signature" — handwritten signature area  
- "date" — any date field
- "select" — fixed-choice fields; include options array:
    Sex→["F","M","X"], Eye Color→["BRN","BLU","GRN","HZL","GRY","BLK"],
    Hair Color→["BLK","BRN","BLD","RED","GRY","WHT"],
    State→["TX","CA","NY","FL","IL","WA","AZ","CO","GA","NC"],
    Class→["A","B","C","M","D"], Blood Type→["A+","A-","B+","B-","AB+","AB-","O+","O-"]
- "text" — everything else

STYLING: fontSize = text height / image height (0.018–0.038). fontColor: "#0d0d0d" dark ink, "#ffffff" white. fontWeight: 700 bold / 600 semi-bold / 400 normal. align: "left"/"center"/"right".

Return ONLY a valid JSON array — no markdown fences, no explanation. Start with [ end with ].`;

function _parseFields(fields) {
  if (!Array.isArray(fields)) throw new Error("AI returned unexpected format.");
  return fields.map((f, i) => ({
    id: slugify(f.label || ("field_" + i)),
    label: f.label || "Field " + (i + 1),
    type: f.type || "text",
    options: f.options,
    x: +(f.x || 0).toFixed(4), y: +(f.y || 0).toFixed(4),
    w: +(f.w || 0.2).toFixed(4), h: +(f.h || 0.05).toFixed(4),
    fontSize:   +(f.fontSize   || 0.025).toFixed(4),
    fontColor:   f.fontColor   || "#0d0d0d",
    fontWeight:  f.fontWeight  || 600,
    align:       f.align       || "left",
    placeholder: f.label       || "",
  }));
}

// ── Google Gemini Vision (free tier, default) ─────────────────────────────
async function detectFieldsWithGemini(imageDataURL) {
  const apiKey = getGeminiKey();
  if (!apiKey) throw new Error("NO_GEMINI_KEY");
  const [header, b64data] = imageDataURL.split(",");
  const mimeType = header.match(/data:(image\/[a-z]+);base64/)?.[1] || "image/jpeg";
  const resp = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: mimeType, data: b64data } },
          { text: "Analyze this document image (blank or filled). Identify every personal data field. Return ONLY the JSON array — no markdown, no explanation." }
        ]}],
        system_instruction: { parts: [{ text: DETECT_SYSTEM_PROMPT }] },
        generationConfig: { maxOutputTokens: 8192 }
      })
    }
  );
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Gemini API error ${resp.status}`);
  }
  const data = await resp.json();
  const raw   = data?.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
  const clean = raw.replace(/^```[a-z]*\n?/, "").replace(/```$/, "").trim();
  return _parseFields(JSON.parse(clean));
}

// ── Anthropic Claude Vision (paid, fallback) ──────────────────────────────
async function detectFieldsWithClaude(imageDataURL) {
  const apiKey = getClaudeKey();
  if (!apiKey) throw new Error("NO_CLAUDE_KEY");
  const [header, b64data] = imageDataURL.split(",");
  const mediaType = header.match(/data:(image\/[a-z]+);base64/)?.[1] || "image/jpeg";
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-opus-4-8",
      max_tokens: 8192,
      system: DETECT_SYSTEM_PROMPT,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: mediaType, data: b64data } },
        { type: "text",  text: "Analyze this document image (blank or filled). Identify every personal data field. Return ONLY the JSON array — no markdown, no explanation." }
      ]}]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Claude API error ${resp.status}`);
  }
  const data  = await resp.json();
  const raw   = data.content?.[0]?.text || "[]";
  const clean = raw.replace(/^```[a-z]*\n?/, "").replace(/```$/, "").trim();
  return _parseFields(JSON.parse(clean));
}

// ── Unified detector: Gemini first (free), Claude fallback ────────────────
async function detectFieldsAI(imageDataURL) {
  const hasGemini = !!getGeminiKey();
  const hasClaude = !!getClaudeKey();
  if (!hasGemini && !hasClaude)
    throw new Error("No AI key set. Go to Admin → AI Key and add a free Gemini key.");
  if (hasGemini) {
    try { return await detectFieldsWithGemini(imageDataURL); }
    catch (e) { if (!hasClaude || e.message === "NO_GEMINI_KEY") throw e; }
  }
  return await detectFieldsWithClaude(imageDataURL);
}

function applyPreset(presetName) {
  const fields = FIELD_PRESETS[presetName];
  if (!fields) return null;
  return fields.map((f,i) => ({
    id: slugify(f.label||("field_"+i)),
    label: f.label,
    type: f.type,
    options: f.options,
    x: f.x, y: f.y, w: f.w, h: f.h,
    fontSize: f.fontSize || 0.025,
    fontColor: f.fontColor || "#111111",
    align: f.align || "left",
    placeholder: f.label,
  }));
}

// ─── Field eraser ─────────────────────────────────────────────────────────────────────────────────
// Samples a border ring OUTSIDE the field rectangle (4px band), averages those
// background pixels into a gradient grid, then flood-fills the interior.
// This reliably covers any pre-printed text without a jarring solid patch.
function eraseFieldRegion(ctx, px, py, pw, ph) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const BORDER = Math.max(3, Math.round(Math.min(pw, ph) * 0.08));

  // Sample the border ring outside the field
  const samples = [];
  const samplePx = (x, y) => {
    const cx = clamp(Math.round(x), 0, W-1);
    const cy = clamp(Math.round(y), 0, H-1);
    const d = ctx.getImageData(cx, cy, 1, 1).data;
    // Skip very dark pixels (they are likely text that bled into the border)
    const brightness = (d[0]+d[1]+d[2]) / 3;
    if (brightness > 30) samples.push({ x:cx, y:cy, r:d[0], g:d[1], b:d[2] });
  };

  const steps = 10;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const lx = px + t * pw, rx = px + t * pw;
    // Top border band
    for (let b = 1; b <= BORDER; b++) {
      samplePx(lx, py - b);
    }
    // Bottom border band
    for (let b = 1; b <= BORDER; b++) {
      samplePx(lx, py + ph + b);
    }
  }
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const ly = py + t * ph;
    // Left border band
    for (let b = 1; b <= BORDER; b++) {
      samplePx(px - b, ly);
    }
    // Right border band
    for (let b = 1; b <= BORDER; b++) {
      samplePx(px + pw + b, ly);
    }
  }

  if (samples.length === 0) {
    // Absolute fallback — white
    ctx.fillStyle = "rgb(240,238,235)";
    ctx.fillRect(Math.floor(px)-1, Math.floor(py)-1, Math.ceil(pw)+2, Math.ceil(ph)+2);
    return;
  }

  // Build a 3x3 spatial average grid so gradients are preserved
  const GRID = 3;
  const cells = Array.from({length:GRID}, () =>
    Array.from({length:GRID}, () => ({r:0,g:0,b:0,n:0}))
  );

  for (const s of samples) {
    const gx = Math.min(GRID-1, Math.floor(((s.x - px) / pw) * GRID));
    const gy = Math.min(GRID-1, Math.floor(((s.y - py) / ph) * GRID));
    const cgx = clamp(gx, 0, GRID-1);
    const cgy = clamp(gy, 0, GRID-1);
    cells[cgy][cgx].r += s.r;
    cells[cgy][cgx].g += s.g;
    cells[cgy][cgx].b += s.b;
    cells[cgy][cgx].n++;
  }

  // Average; fill empty cells from neighbours
  const avg = cells.map(row => row.map(c => c.n
    ? { r: Math.round(c.r/c.n), g: Math.round(c.g/c.n), b: Math.round(c.b/c.n) }
    : null
  ));
  // Fill nulls with nearest non-null
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      if (!avg[gy][gx]) {
        for (let r = 1; r < GRID*2; r++) {
          let found = false;
          for (let dy = -r; dy <= r && !found; dy++) {
            for (let dx = -r; dx <= r && !found; dx++) {
              const ny = gy+dy, nx = gx+dx;
              if (ny>=0&&ny<GRID&&nx>=0&&nx<GRID&&avg[ny][nx]) {
                avg[gy][gx] = {...avg[ny][nx]};
                found = true;
              }
            }
          }
          if (found) break;
        }
        if (!avg[gy][gx]) avg[gy][gx] = {r:240,g:238,b:235};
      }
    }
  }

  // Paint the interior using bilinear interpolation of the grid
  const x0 = Math.floor(px), y0 = Math.floor(py);
  const x1 = Math.ceil(px+pw), y1 = Math.ceil(py+ph);
  const rw = x1-x0, rh = y1-y0;
  if (rw <= 0 || rh <= 0) return;

  const imgData = ctx.getImageData(x0, y0, rw, rh);
  const d = imgData.data;

  for (let ly = 0; ly < rh; ly++) {
    for (let lx = 0; lx < rw; lx++) {
      const gxf = (lx / rw) * (GRID - 1);
      const gyf = (ly / rh) * (GRID - 1);
      const gx0 = Math.floor(gxf), gy0 = Math.floor(gyf);
      const gx1 = Math.min(gx0+1, GRID-1), gy1 = Math.min(gy0+1, GRID-1);
      const tx = gxf - gx0, ty = gyf - gy0;
      const lerp = (a, b, t) => a + (b-a)*t;
      const bi = (k) => lerp(
        lerp(avg[gy0][gx0][k], avg[gy0][gx1][k], tx),
        lerp(avg[gy1][gx0][k], avg[gy1][gx1][k], tx),
        ty
      );
      const i = (ly * rw + lx) * 4;
      d[i]   = Math.round(bi("r"));
      d[i+1] = Math.round(bi("g"));
      d[i+2] = Math.round(bi("b"));
      d[i+3] = 255;
    }
  }

  ctx.putImageData(imgData, x0, y0);
}

// ─── Canvas renderer ──────────────────────────────────────────────────────────
// 1. Draw the template image onto a canvas at its natural size.
// 2. For EVERY field (regardless of whether user filled it or not):
//    erase the field zone by inpainting the background.
// 3. Then draw user values on top of the clean zones.
async function renderToCanvas(template, formData, imageMap) {
  const img = await loadImg(template.imageURL);
  const cvs = document.createElement("canvas");
  cvs.width  = img.naturalWidth;
  cvs.height = img.naturalHeight;
  const ctx  = cvs.getContext("2d");
  ctx.drawImage(img, 0, 0);

  const fields = getFields(template);

  // ── Pass 1: erase ALL field zones so no original data bleeds through ────────
  for (const f of fields) {
    const px = (f.x||0) * cvs.width;
    const py = (f.y||0) * cvs.height;
    const pw = (f.w||0.2) * cvs.width;
    const ph = (f.h||0.04) * cvs.height;
    eraseFieldRegion(ctx, px, py, pw, ph);
  }

  // ── Pass 2: draw user values onto the now-clean zones ───────────────────────
  for (const f of fields) {
    const px = (f.x||0) * cvs.width;
    const py = (f.y||0) * cvs.height;
    const pw = (f.w||0.2) * cvs.width;
    const ph = (f.h||0.04) * cvs.height;

    if (f.type === "photo" || f.type === "signature" || f.type === "image") {
      const src = imageMap[f.id];
      if (!src) continue;
      try {
        const sub = await loadImg(src);
        // Fill with white backing first so transparent PNGs look clean
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fillRect(px, py, pw, ph);
        // Draw image scaled to fill the zone (cover)
        const scale = Math.max(pw/sub.naturalWidth, ph/sub.naturalHeight);
        const dw = sub.naturalWidth*scale, dh = sub.naturalHeight*scale;
        ctx.save();
        ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
        ctx.drawImage(sub, px+(pw-dw)/2, py+(ph-dh)/2, dw, dh);
        ctx.restore();
      } catch {}
    } else {
      const text = String(formData[f.id]||"").trim();
      if (!text) continue;

      const size   = Math.max(8, (f.fontSize||0.025) * cvs.height);
      const weight = f.fontWeight || "700";
      ctx.font         = `${weight} ${size}px Arial, sans-serif`;
      ctx.fillStyle    = f.fontColor || "#111111";
      ctx.textBaseline = "middle";
      ctx.textAlign    = f.align || "left";

      // Vertical centre of the zone
      const ty = py + ph / 2;
      const tx = f.align==="center" ? px+pw/2 : f.align==="right" ? px+pw-2 : px+2;

      if (f.prefix) {
        // Dim label prefix
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.font = `400 ${size*0.88}px Arial, sans-serif`;
        ctx.textAlign = "left";
        const prefixW = ctx.measureText(f.prefix).width + 3;
        ctx.fillText(f.prefix, px+2, ty, pw*0.4);
        ctx.restore();
        ctx.font      = `${weight} ${size}px Arial, sans-serif`;
        ctx.textAlign = "left";
        ctx.fillText(text, px+2+prefixW, ty, pw - prefixW - 4);
      } else {
        ctx.fillText(text, tx, ty, pw - 4);
      }
    }
  }

  return cvs.toDataURL("image/png");
}

  const submit = async () => {
    setErr(""); setLoading(true);
    try {
      if (mode === "register") {
        if (form.password !== form.confirm) throw new Error("Passwords don't match.");
        if (form.password.length < 6) throw new Error("Password must be at least 6 characters.");
        const cred = await fb.register(form.email, form.password);
        await fb.updateProfile(cred.user, { displayName: form.name });
        await fb.setDoc(fb.doc(fb.db, "users", cred.user.uid), {
          displayName:form.name, email:form.email,
          createdAt:fb.serverTimestamp(), credits:0, plan:"free", totalGenerations:0,

      else setUserDoc({ displayName:authUser.displayName, email:authUser.email, credits:0, plan:"free", totalGenerations:0 });
    });
    setProfileForm({ displayName:authUser.displayName||"", email:authUser.email||"" });
  }, [authUser, fb]);

  const loadHistory = useCallback(async () => {
    if (!authUser || !fb) return;
    setLoadingHistory(true);
    try {
      const q = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid),fb.orderBy("createdAt","desc"));
      const snap = await fb.getDocs(q);
      setHistory(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    } catch {
      try {
        const q2 = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid));
        const snap2 = await fb.getDocs(q2);
        setHistory(snap2.docs.map(d => ({ id:d.id,...d.data() })).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
      } catch { setHistory([]); }
    }
    setLoadingHistory(false);
  }, [authUser, fb]);

  useEffect(() => { if (tab==="history") loadHistory(); }, [tab, loadHistory]);

  const saveProfile = async () => {
    setSavingProfile(true);
    try {
      await fb.updateProfile(authUser, { displayName:profileForm.displayName });
      await fb.setDoc(fb.doc(fb.db,"users",authUser.uid),{ displayName:profileForm.displayName },{ merge:true });

    setSavingProfile(false);
  };

  const deleteGeneration = async (id) => {
    try {
      await fb.deleteDoc(fb.doc(fb.db,"generations",id));

          <button className="db-mobile-btn" onClick={()=>setSideOpen(true)}

        {tab==="home" && (

// ─── Template Detail ───────────────────────────────────────────────────────────
const TemplateDetail = ({ template, setPage, authUser, fb, showToast }) => {
  const fields = getFields(template);
  const [formData, setFormData] = useState({});
  const [imageMap, setImageMap] = useState({});
  const [generating, setGenerating] = useState(false);
  const [imgH, setImgH] = useState(0);
  const imgRef = React.useCallback(node => {
    if (!node) return;
    const ro = new ResizeObserver(e => setImgH(e[0].contentRect.height));
    ro.observe(node);
  }, []);

  const setField = (id, val) => setFormData(p => ({ ...p, [id]: val }));
  const setFieldImage = async (id, file) => {
    if (!file) return;
    const dataURL = await fileToDataURL(file);
    setImageMap(p => ({ ...p, [id]: dataURL }));
  };
  const isImg = (t) => t==="photo"||t==="signature"||t==="image";

  const generate = async () => {
    setGenerating(true);
    try {
      let renderedURL = null;
      if (template?.imageURL) renderedURL = await renderToCanvas(template, formData, imageMap);
      await fb.addDoc(fb.collection(fb.db,"generations"), {
        userId:authUser.uid, templateId:template.id, templateName:template.name,
        templateCategory:template.category, formData:{...formData},
        renderedURL: renderedURL && renderedURL.length < 900000 ? renderedURL : null,
        purchased:false, createdAt:fb.serverTimestamp(),
      });
      const uSnap = await fb.getDoc(fb.doc(fb.db,"users",authUser.uid));
      await fb.setDoc(fb.doc(fb.db,"users",authUser.uid),{ totalGenerations:(uSnap.data()?.totalGenerations||0)+1 },{ merge:true });
      if (renderedURL) sessionStorage.setItem("proofit_last_rendered", renderedURL);
      else sessionStorage.removeItem("proofit_last_rendered");
      // Always store form data so GeneratedPreview can re-render if renderedURL was too large
      try {
        sessionStorage.setItem("proofit_last_formdata", JSON.stringify({ formData, imageMap, templateId: template.id }));
      } catch {}  
      showToast("Document generated!");
      setTimeout(() => setPage("generated"), 600);
    } catch (e) { showToast("Generation failed: "+e.message,"error"); }
    setGenerating(false);
  };

  return (
    <div style={{ minHeight:"100vh", paddingTop:56, padding:"56px 16px 60px" }}>
      <style>{`@media(max-width:800px){.td-grid{grid-template-columns:1fr!important}} .td-sticky{position:static!important} @media(min-width:801px){.td-sticky{position:sticky!important}}`}</style>
      <div style={{ maxWidth:1100, margin:"0 auto", width:"100%" }}>
        <button onClick={()=>setPage("dashboard")} style={{ background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6,marginBottom:20 }}>
          ← Back to Templates
        </button>

        <div style={{ display:"flex",alignItems:"center",gap:12,marginBottom:22 }}>
          <h1 style={{ fontFamily:"'Sora',sans-serif",fontSize:22,fontWeight:900,color:"#fff",margin:0 }}>{template?.name}</h1>
          <Badge color={template?.color||C.accent2}>{template?.category}</Badge>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1.1fr 1fr", gap:22, alignItems:"start" }} className="td-grid">

          {/* LIVE PREVIEW */}
          <div className="td-sticky" style={{ top:68 }}>
            <Glass style={{ padding:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:C.dim, letterSpacing:"0.08em", marginBottom:10 }}>LIVE PREVIEW — updates as you fill in details</div>
              {template?.imageURL ? (
                <div style={{ position:"relative", width:"100%", borderRadius:10, overflow:"hidden", border:"1px solid rgba(255,255,255,0.1)", boxShadow:"0 8px 40px rgba(0,0,0,0.5)" }}>
                  <img ref={imgRef} src={template.imageURL} alt={template.name} style={{ width:"100%", display:"block" }}/>
                  {fields.map(f => {
                    const fs = Math.max(7, (f.fontSize||0.025) * imgH);
                    const val = formData[f.id];
                    const imgSrc = imageMap[f.id];
                    return (
                      <div key={f.id} style={{ position:"absolute", left:(f.x||0)*100+"%", top:(f.y||0)*100+"%", width:(f.w||0.2)*100+"%", height:(f.h||0.05)*100+"%", overflow:"hidden", pointerEvents:"none", display:"flex", alignItems:"center",
                        justifyContent: f.align==="center"?"center": f.align==="right"?"flex-end":"flex-start" }}>
                        {isImg(f.type) ? (
                          imgSrc
                            ? <img src={imgSrc} style={{ width:"100%",height:"100%",objectFit:"cover" }}/>
                            : <div style={{ width:"100%",height:"100%",background:"rgba(255,255,255,0.15)",border:"1.5px dashed rgba(0,0,0,0.3)",display:"flex",alignItems:"center",justifyContent:"center" }}>
                                <span style={{ fontSize:Math.max(8,imgH*0.018)+"px",color:"rgba(0,0,0,0.35)",fontWeight:600 }}>{f.label}</span>
                              </div>
                        ) : val ? (
                          <span style={{ fontFamily:"'Sora',Arial,sans-serif", fontSize:fs+"px", color:f.fontColor||"#111", fontWeight:600, whiteSpace:"nowrap", padding:"0 2px" }}>
                            {val}
                          </span>
                        ) : null}
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div style={{ minHeight:220,display:"flex",alignItems:"center",justifyContent:"center",border:"1px dashed rgba(255,255,255,0.1)",borderRadius:10,color:C.dim,fontSize:13 }}>
                  No template image yet
                </div>
              )}
            </Glass>
          </div>

          {/* FORM */}
          <Glass style={{ padding:24 }}>
            <h2 style={{ fontFamily:"'Sora',sans-serif",fontSize:16,fontWeight:800,color:"#fff",margin:"0 0 18px" }}>Fill In Your Details</h2>
            <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
              {fields.length===0 && <p style={{ fontSize:13,color:C.dim }}>No fields configured for this template yet.</p>}
              {fields.map(field => (
                <div key={field.id}>
                  {(field.type==="text"||field.type==="date") && (
                    <Input label={field.label} type={field.type} placeholder={field.placeholder||field.label}
                      value={formData[field.id]||""} onChange={e=>setField(field.id,e.target.value)}/>
                  )}
                  {field.type==="textarea" && (
                    <label style={{ display:"flex",flexDirection:"column",gap:7 }}>
                      <span style={{ fontSize:12,fontWeight:600,color:C.muted }}>{field.label}</span>
                      <textarea rows={3} value={formData[field.id]||""} onChange={e=>setField(field.id,e.target.value)} style={{ ...iStyle,fontFamily:"inherit",resize:"vertical" }}/>
                    </label>
                  )}
                  {field.type==="select" && (
                    <Input label={field.label} type="select" options={field.options||[]} value={formData[field.id]||""} onChange={e=>setField(field.id,e.target.value)}/>
                  )}
                  {isImg(field.type) && (
                    <div>
                      <div style={{ fontSize:12,fontWeight:600,color:C.muted,marginBottom:7 }}>{field.label}</div>
                      <label style={{ display:"flex",alignItems:"center",gap:12,background:"rgba(255,255,255,0.03)",border:"1px dashed rgba(255,255,255,0.12)",borderRadius:10,padding:"12px",cursor:"pointer" }}>
                        <div style={{ width:56,height:56,borderRadius:8,background:"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,border:"1px solid rgba(255,255,255,0.1)" }}>
                          {imageMap[field.id]
                            ? <img src={imageMap[field.id]} style={{ width:"100%",height:"100%",objectFit:"cover" }}/>
                            : <Icon d={field.type==="signature"?IC.zap:IC.camera} size={22} stroke={C.dim}/>}
                        </div>
                        <div>
                          <div style={{ fontSize:13,color:"#fff",fontWeight:600 }}>{imageMap[field.id]?"Photo selected":"Upload {label}".replace("{label}",field.label)}</div>
                          <div style={{ fontSize:11,color:C.dim,marginTop:2 }}>{imageMap[field.id]?"Click to replace":"JPG, PNG supported"}</div>
                        </div>
                        <input type="file" accept="image/*" style={{ display:"none" }} onChange={e=>setFieldImage(field.id,e.target.files[0])}/>
                      </label>
                    </div>
                  )}
                </div>
              ))}
              <Btn variant="primary" onClick={generate} disabled={generating}
                style={{ marginTop:8,justifyContent:"center",padding:"14px 22px",fontSize:15 }}>
                {generating?<><Spinner size={17}/> Generating…</>:<><Icon d={IC.zap} size={18}/> Generate Document</>}
              </Btn>
              <p style={{ fontSize:11,color:C.dim,textAlign:"center",margin:0 }}>Preview updates live. Hit Generate when ready.</p>
            </div>
          </Glass>
        </div>
      </div>
    </div>
  );
};

// ─── Generated Preview ─────────────────────────────────────────────────────────
const GeneratedPreview = ({ template, setPage, authUser, fb, showToast }) => {
  const [purchased, setPurchased] = useState(false);
  const [purchasing, setPurchasing] = useState(false);
  const [latestGen, setLatestGen] = useState(null);
  const [reRendered, setReRendered] = useState(null);

  // Primary: sessionStorage rendered image (set immediately before navigation)
  // Fallback: Firestore renderedURL (may be null if image was too large to store)
  const ssRendered = typeof sessionStorage !== "undefined" ? sessionStorage.getItem("proofit_last_rendered") : null;
  const rendered = ssRendered || reRendered || latestGen?.renderedURL || null;

  useEffect(() => {
    (async () => {
      if (!template || !authUser) return;
      try {
        const q = fb.query(fb.collection(fb.db,"generations"),fb.where("userId","==",authUser.uid),fb.where("templateId","==",template.id));
        const snap = await fb.getDocs(q);
        const latest = snap.docs.sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0))[0];
        if (latest) { setLatestGen({ id:latest.id, ...latest.data() }); setPurchased(!!latest.data().purchased); }
      } catch {}
    })();
  }, [template, authUser]);

  // If no rendered image available yet, try re-rendering from stored form data
  useEffect(() => {
    if (rendered || !template?.imageURL) return;
    (async () => {
      try {
        const raw = typeof sessionStorage !== "undefined" ? sessionStorage.getItem("proofit_last_formdata") : null;
        if (!raw) return;
        const { formData, imageMap, templateId } = JSON.parse(raw);
        if (templateId !== template.id) return;
        const url = await renderToCanvas(template, formData, imageMap);
        setReRendered(url);
      } catch {}
    })();
  }, [template, rendered]);

  const purchase = async () => {
    setPurchasing(true);
    try {
      if (latestGen) await fb.updateDoc(fb.doc(fb.db,"generations",latestGen.id),{ purchased:true });
      await fb.setDoc(fb.doc(fb.db,"users",authUser.uid),{ credits:-4.99 },{ merge:true });
      showToast("Purchase complete! Download unlocked.");
      setPurchased(true);
    } catch { showToast("Purchase failed. Try again.","error"); }
    setPurchasing(false);
  };

  const download = () => {
    if (!rendered) return;
    const a = document.createElement("a");
    a.href = rendered;
    a.download = (template?.name||"document").replace(/\s+/g,"_") + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  };

  return (
    <div style={{ minHeight:"100vh",paddingTop:56,padding:"56px 16px 60px" }}>
      <div style={{ maxWidth:780,margin:"0 auto",width:"100%" }}>
        <button onClick={()=>setPage("template-detail")} style={{ background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",marginBottom:22 }}>← Back to Editor</button>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18 }}>
          <h1 style={{ fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:"#fff",margin:0 }}>Document Preview</h1>
          <Badge color="#10B981">Generated ✓</Badge>
        </div>
        {!purchased && (
          <Glass style={{ padding:14,marginBottom:18,border:"1px solid rgba(245,158,11,0.22)",background:"rgba(245,158,11,0.05)" }}>
            <div style={{ display:"flex",gap:11,alignItems:"center" }}>
              <Icon d={IC.lock} size={19} stroke="#F59E0B"/>
              <div>
                <div style={{ fontSize:13,fontWeight:700,color:"#FBBF24" }}>Preview Only — Purchase to Download</div>
                <div style={{ fontSize:12,color:"#9CA3AF" }}>Watermark applied. Purchase to receive the clean version.</div>
              </div>
            </div>
          </Glass>
        )}
        <Glass style={{ padding:0,overflow:"hidden",marginBottom:22 }}>
          {rendered ? (
            <div style={{ position:"relative" }}>
              <img src={rendered} alt="Generated" style={{ width:"100%",display:"block" }} />
              {!purchased && (
                <div style={{ position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden" }}>
                  {Array.from({length:24}).map((_,i)=>(
                    <div key={i} style={{ position:"absolute",fontSize:18,fontWeight:900,color:"rgba(0,0,0,0.22)",
                      textShadow:"0 0 6px rgba(255,255,255,0.5)",
                      letterSpacing:"0.2em",whiteSpace:"nowrap",transform:"rotate(-30deg)",
                      left:`${(i%4)*28-8}%`,top:`${Math.floor(i/4)*22-5}%` }}>★ PREVIEW ONLY ★</div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div style={{ padding:36,minHeight:280,color:C.dim,textAlign:"center" }}>
              <div style={{ fontSize:13 }}>No rendered preview available. This template has no uploaded reference image — admin can upload one in the Admin Panel.</div>
            </div>
          )}
        </Glass>
        <div style={{ display:"flex",gap:10,flexWrap:"wrap" }}>
          {!purchased ? (
            <Btn variant="success" onClick={purchase} disabled={purchasing} style={{ flex:1,justifyContent:"center",padding:"13px 22px",fontSize:14 }}>
              {purchasing?<><Spinner size={16}/> Processing…</>:<><Icon d={IC.download} size={17}/> Purchase Download — $4.99</>}
            </Btn>
          ) : (
            <Btn variant="success" onClick={download} style={{ flex:1,justifyContent:"center",padding:"13px 22px",fontSize:14 }}>
              <Icon d={IC.download} size={17}/> Download Document
            </Btn>
          )}
          <Btn variant="ghost" onClick={()=>setPage("template-detail")} style={{ padding:"13px 18px" }}>Generate Again</Btn>
        </div>
      </div>
    </div>
  );
};

// ─── Admin Panel ───────────────────────────────────────────────────────────────
const AdminPanel = ({ setPage, fb, showToast, authUser, customTemplates, reloadTemplates }) => {
  const [section, setSection] = useState("overview");
  const [users, setUsers] = useState([]);
  const [gens, setGens] = useState([]);
  const [loading, setLoading] = useState(false);
  const [editor, setEditor] = useState(null);
  const [saving, setSaving] = useState(false);
  const [autoDetectPending, setAutoDetectPending] = useState(null);
  const [geminiKey,  setGeminiKeyState] = useState(getGeminiKey);
  const [claudeKey,  setClaudeKeyState] = useState(getClaudeKey);

  const loadData = useCallback(async () => {
    if (!fb) return;
    setLoading(true);
    try {
      const [uSnap, gSnap] = await Promise.all([
        fb.getDocs(fb.collection(fb.db,"users")),
        fb.getDocs(fb.collection(fb.db,"generations")),
      ]);
      setUsers(uSnap.docs.map(d => ({ id:d.id,...d.data() })));
      setGens(gSnap.docs.map(d => ({ id:d.id,...d.data() })));
    } catch (e) { showToast("Failed to load data: "+e.message,"error"); }
    setLoading(false);
  }, [fb]);

  useEffect(() => { loadData(); }, [loadData]);

  const adminNav = [
    { id:"overview", icon:IC.activity, label:"Overview" },
    { id:"templates", icon:IC.layers, label:"Templates" },
    { id:"add", icon:IC.upload, label:"Add / Edit" },
    { id:"users", icon:IC.user, label:"Users" },
    { id:"orders", icon:IC.creditCard, label:"Orders" },
    { id:"settings", icon:IC.settings, label:"AI Key" },
  ];

  const purchased = gens.filter(g => g.purchased);
  const revenue = purchased.length * 4.99;

  const customById = Object.fromEntries((customTemplates||[]).map(t => [t.id, t]));
  const allRows = [
    ...ALL_TEMPLATES.map(t => ({ ...t, custom:customById[t.id], effectiveFields:getFields(customById[t.id]||t) })),
    ...(customTemplates||[]).filter(t => !ALL_TEMPLATES.find(b => b.id === t.id)).map(t => ({ ...t, custom:t, effectiveFields:getFields(t) })),
  ];

  const startEdit = (row) => {
    const c = row.custom;
    setEditor({
      id: c?.id || row.id,
      docId: c?._docId || null,
      baseId: ALL_TEMPLATES.find(b=>b.id===row.id) ? row.id : null,
      name: row.name,
      category: row.category,
      color: row.color,
      catId: row.catId,
      imageURL: c?.imageURL || "",
      fields: getFields(c||row),
    });
    setSection("add");
  };

  const startNew = () => {
    setEditor({
      id: "custom_"+Date.now().toString(36),
      docId: null, baseId: null, name: "",
      category: CATEGORIES[0].name, catId: CATEGORIES[0].id, color: CATEGORIES[0].color,
      imageURL: "", fields: [],
    });
    setSection("add");
  };

  const onPickImage = async (file, autoDetect = true) => {
    if (!file) return;
    const dataURL = await fileToDataURL(file);
    setEditor(e => ({ ...e, imageURL: dataURL, _imgFile: file, fields: autoDetect ? e.fields : e.fields }));
    // Trigger Claude auto-detection after setting image
    if (autoDetect && (getGeminiKey() || getClaudeKey())) {
      setAutoDetectPending(dataURL);
    }
  };

  const detect = (presetName) => {
    const fields = applyPreset(presetName);
    if (!fields) return showToast("Unknown preset.","warning");
    setEditor(e => ({ ...e, fields }));
    showToast(`Loaded ${fields.length} fields for "${presetName}".`);
  };

  const runAdminAIDetect = async () => {
    if (!editor?.imageURL) return showToast("Upload an image first.","warning");
    if (!getGeminiKey() && !getClaudeKey()) return showToast("Add a free Gemini key (or Anthropic key) in AI Key settings first.","warning");
    setAutoDetectPending(editor.imageURL);
  };

  const updateField = (i, patch) => setEditor(e => ({ ...e, fields: e.fields.map((f,j)=> j===i?{...f,...patch}:f) }));
  const removeField = (i) => setEditor(e => ({ ...e, fields: e.fields.filter((_,j)=>j!==i) }));
  const addField = () => setEditor(e => ({ ...e, fields: [...e.fields, { id:slugify("field "+(e.fields.length+1)), label:"New Field", type:"text", x:0.1, y:0.1, w:0.3, h:0.04, fontSize:0.025, fontColor:"#111111", align:"left" }] }));

  const saveTemplate = async () => {
    if (!editor) return;
    if (!editor.name) return showToast("Name required.","warning");
    if (!editor.imageURL) return showToast("Image required.","warning");
    setSaving(true);
    try {
      let imageURL = editor.imageURL;
      if (editor._imgFile && fb.storage) {
        try {
          const ref = fb.ref(fb.storage, `templates/${editor.id}_${Date.now()}_${editor._imgFile.name}`);
          await fb.uploadBytes(ref, editor._imgFile);
          imageURL = await fb.getDownloadURL(ref);
        } catch (err) { /* fall back to dataURL */ }
      }
      const payload = {
        id: editor.id, name: editor.name, category: editor.category, catId: editor.catId,
        color: editor.color, baseId: editor.baseId || null, imageURL,
        fields: editor.fields, updatedAt: fb.serverTimestamp(), createdBy: authUser.uid,
      };
      if (editor.docId) {
        await fb.updateDoc(fb.doc(fb.db,"customTemplates",editor.docId), payload);
      } else {
        await fb.addDoc(fb.collection(fb.db,"customTemplates"), { ...payload, createdAt: fb.serverTimestamp() });
      }
      showToast("Template saved.");
      await reloadTemplates();
      setSection("templates");
      setEditor(null);
    } catch (e) { showToast("Save failed: "+e.message,"error"); }
    setSaving(false);
  };

  const deleteCustom = async (docId) => {
    if (!docId) return;
    if (!window.confirm("Delete this custom template?")) return;
    try {
      await fb.deleteDoc(fb.doc(fb.db,"customTemplates",docId));
      await reloadTemplates();
      showToast("Deleted.");
    } catch (e) { showToast("Delete failed.","error"); }
  };



  const [adminSideOpen, setAdminSideOpen] = React.useState(false);
  return (
    <div style={{ minHeight:"100vh",paddingTop:56,display:"flex",position:"relative" }}>
      <style>{`
        .adm-sidebar{display:flex!important;flex-direction:column}
        .adm-mob-btn{display:none!important}
        @media(max-width:768px){
          .adm-sidebar{display:none!important}
          .adm-mob-btn{display:flex!important}
        }
      `}</style>
      {adminSideOpen && (
        <div style={{ position:"fixed",top:0,left:0,right:0,bottom:0,zIndex:200,background:"rgba(11,15,25,0.97)",padding:"70px 12px 24px",backdropFilter:"blur(20px)",overflowY:"auto",display:"flex",flexDirection:"column",gap:3 }}>
          <button onClick={()=>setAdminSideOpen(false)} style={{ position:"absolute",top:16,right:16,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:6,color:"#fff",cursor:"pointer",display:"flex",alignItems:"center" }}><Icon d={IC.x} size={20}/></button>
          <div style={{ padding:"6px 10px",marginBottom:12 }}><Badge color="#EF4444">ADMIN</Badge></div>
          {adminNav.map(item => (
            <button key={item.id} onClick={()=>{setSection(item.id);setAdminSideOpen(false);}}
              style={{ display:"flex",alignItems:"center",gap:9,padding:"10px 11px",borderRadius:9,border:"none",cursor:"pointer",fontSize:14,fontWeight:500,background:section===item.id?"rgba(239,68,68,0.15)":"transparent",color:section===item.id?"#F87171":"#9CA3AF",width:"100%",transition:"all 0.2s",fontFamily:"inherit" }}>
              <Icon d={item.icon} size={16} stroke="currentColor"/> {item.label}
            </button>
          ))}
          <div style={{ marginTop:16,paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.06)" }}>
            <button onClick={()=>setPage("dashboard")} style={{ display:"flex",alignItems:"center",gap:9,padding:"9px 11px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,color:C.dim,background:"transparent",fontFamily:"inherit",width:"100%" }}>← User View</button>
          </div>
        </div>
      )}
      <div className="adm-sidebar" style={{ width:200,background:"rgba(17,24,39,0.85)",borderRight:"1px solid rgba(255,255,255,0.06)",padding:"20px 12px",backdropFilter:"blur(20px)",flexShrink:0,position:"sticky",top:56,height:"calc(100vh - 56px)",overflowY:"auto" }}>
        <div style={{ padding:"6px 10px",marginBottom:12 }}><Badge color="#EF4444">ADMIN</Badge></div>
        {adminNav.map(item => (
          <button key={item.id} onClick={()=>setSection(item.id)}
            style={{ display:"flex",alignItems:"center",gap:9,padding:"9px 11px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,background:section===item.id?"rgba(239,68,68,0.15)":"transparent",color:section===item.id?"#F87171":"#9CA3AF",width:"100%",transition:"all 0.2s",fontFamily:"inherit" }}>
            <Icon d={item.icon} size={16} stroke="currentColor"/> {item.label}
          </button>
        ))}
        <div style={{ marginTop:"auto",paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.06)" }}>
          <button onClick={()=>setPage("dashboard")} style={{ display:"flex",alignItems:"center",gap:9,padding:"9px 11px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,color:C.dim,background:"transparent",fontFamily:"inherit",width:"100%" }}>← User View</button>
        </div>
      </div>
      <div style={{ flex:1,padding:"20px 16px",overflow:"auto",minWidth:0 }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:10 }}>
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <button className="adm-mob-btn" onClick={()=>setAdminSideOpen(true)} style={{ background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:7,cursor:"pointer",display:"flex",alignItems:"center" }}><Icon d={IC.menu} size={17}/></button>
            <h1 style={{ fontFamily:"'Sora',sans-serif",fontSize:18,fontWeight:800,color:"#fff",margin:0 }}>{adminNav.find(n=>n.id===section)?.label}</h1>
          </div>
          <div style={{ display:"flex",gap:8,flexWrap:"wrap" }}>
            {section==="templates" && <Btn variant="primary" onClick={startNew} style={{ padding:"7px 14px",fontSize:12 }}><Icon d={IC.upload} size={14}/> New Template</Btn>}
            <Btn variant="ghost" onClick={loadData} style={{ padding:"7px 14px",fontSize:12 }}><Icon d={IC.refresh} size={14}/> Refresh</Btn>
          </div>
        </div>

        {loading && <div style={{ textAlign:"center",padding:40 }}><Spinner size={32}/></div>}

        {!loading && section==="overview" && (
          <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:14 }}>
            {[
              {label:"Total Users",value:users.length,color:"#3B82F6"},
              {label:"Templates",value:allRows.length,color:"#10B981"},
              {label:"Custom Templates",value:(customTemplates||[]).length,color:"#06B6D4"},
              {label:"All Generations",value:gens.length,color:"#F59E0B"},
              {label:"Purchased",value:purchased.length,color:"#8B5CF6"},
              {label:"Revenue",value:`$${revenue.toFixed(2)}`,color:"#EC4899"},
            ].map(s=>(
              <Glass key={s.label} style={{ padding:18 }}>
                <div style={{ fontSize:26,fontWeight:900,fontFamily:"'Sora',sans-serif",color:s.color,marginBottom:5 }}>{s.value}</div>
                <div style={{ fontSize:12,color:C.dim }}>{s.label}</div>
              </Glass>
            ))}
          </div>
        )}

        {!loading && section==="templates" && (
          <Glass style={{ padding:0,overflow:"auto" }}>
            <table style={{ width:"100%",borderCollapse:"collapse",minWidth:720 }}>
              <thead><tr style={{ borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
                {["Template","Category","Image","Fields","Type","Actions"].map(h=>(
                  <th key={h} style={{ padding:"12px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>{allRows.map(t=>(
                <tr key={t.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                  <td style={{ padding:"11px 16px",fontSize:13,color:"#fff",fontWeight:500 }}>{t.name}</td>
                  <td style={{ padding:"11px 16px" }}><Badge color={t.color}>{t.category}</Badge></td>
                  <td style={{ padding:"11px 16px" }}>{t.custom?.imageURL ? <img src={t.custom.imageURL} style={{ width:50,height:34,objectFit:"cover",borderRadius:4 }}/> : <span style={{ fontSize:11,color:C.dim }}>—</span>}</td>
                  <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{t.effectiveFields.length}</td>
                  <td style={{ padding:"11px 16px" }}><Badge color={t.custom?"#06B6D4":"#10B981"}>{t.custom?"Custom":"Built-in"}</Badge></td>
                  <td style={{ padding:"11px 16px" }}>
                    <div style={{ display:"flex",gap:6 }}>
                      <button onClick={()=>startEdit(t)} style={{ background:"rgba(59,130,246,0.15)",border:"1px solid rgba(59,130,246,0.3)",borderRadius:6,padding:"5px 9px",cursor:"pointer",color:"#60A5FA",fontSize:11,fontFamily:"inherit" }}>Edit</button>
                      {t.custom?._docId && (
                        <button onClick={()=>deleteCustom(t.custom._docId)} style={{ background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:6,padding:"5px 9px",cursor:"pointer",color:"#F87171",fontSize:11,fontFamily:"inherit" }}>Delete</button>
                      )}
                    </div>
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </Glass>
        )}

        {!loading && section==="add" && (
          editor ? <TemplateEditor editor={editor} setEditor={setEditor} onPickImage={onPickImage} updateField={updateField} removeField={removeField} addField={addField} saveTemplate={saveTemplate} saving={saving} showToast={showToast} autoDetectPending={autoDetectPending} setAutoDetectPending={setAutoDetectPending} />
            : (
              <Glass style={{ padding:32,textAlign:"center" }}>
                <p style={{ color:C.dim,fontSize:14,marginBottom:14 }}>Pick a template from "Templates" to edit, or start a new one.</p>
                <Btn variant="primary" onClick={startNew}>+ New Template</Btn>
              </Glass>
            )
        )}

        {!loading && section==="settings" && (() => {
          const hasGemini = !!geminiKey;
          const hasClaude = !!claudeKey;

          const KeyCard = ({ title, badge, badgeColor, storageKey, curValue, setStateFn, placeholder, hint, link, linkLabel, isFree }) => {
            const inputId = "key-input-" + storageKey;
            const save = () => {
              const v = document.getElementById(inputId)?.value?.trim();
              if (!v) return showToast("Enter a valid key", "warning");
              if (storageKey === GEMINI_KEY_STORAGE) { setGeminiKey(v); setStateFn(v); }
              else                                   { setClaudeKey(v); setStateFn(v); }
              showToast(title + " key saved!");
            };
            const remove = () => {
              if (storageKey === GEMINI_KEY_STORAGE) { setGeminiKey(""); setStateFn(""); }
              else                                   { setClaudeKey(""); setStateFn(""); }
            };
            return (
              <Glass style={{ padding:20 }}>
                <div style={{ display:"flex",alignItems:"center",gap:9,marginBottom:13 }}>
                  <h3 style={{ fontFamily:"'Sora',sans-serif",fontSize:14,fontWeight:700,color:"#fff",margin:0,flex:1 }}>{title}</h3>
                  {isFree && <span style={{ background:"rgba(16,185,129,0.15)",color:"#10B981",fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20,border:"1px solid rgba(16,185,129,0.3)",letterSpacing:"0.05em" }}>FREE</span>}
                  <Badge color={badgeColor}>{badge}</Badge>
                </div>
                {curValue ? (
                  <div style={{ display:"flex",alignItems:"center",gap:10,background:"rgba(16,185,129,0.07)",border:"1px solid rgba(16,185,129,0.22)",borderRadius:9,padding:"10px 13px",marginBottom:11 }}>
                    <Icon d={IC.check} size={16} stroke="#10B981"/>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:12,fontWeight:600,color:"#10B981" }}>Key configured ✓</div>
                      <div style={{ fontSize:11,color:C.dim,marginTop:1 }}>…{curValue.slice(-8)} (browser localStorage only)</div>
                    </div>
                    <button onClick={remove} style={{ background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:7,padding:"4px 10px",cursor:"pointer",color:"#F87171",fontSize:11,fontFamily:"inherit" }}>Remove</button>
                  </div>
                ) : (
                  <div style={{ display:"flex",alignItems:"center",gap:9,background:"rgba(245,158,11,0.07)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:9,padding:"10px 13px",marginBottom:11 }}>
                    <Icon d={IC.alertCircle} size={16} stroke="#F59E0B"/>
                    <div style={{ fontSize:12,color:"#FBBF24" }}>No key set</div>
                  </div>
                )}
                <div style={{ display:"flex",gap:8,marginBottom:6 }}>
                  <input id={inputId} type="password" placeholder={placeholder}
                    style={{ ...iStyle, flex:1 }}
                    onKeyDown={e => { if (e.key === "Enter") save(); }}/>
                  <button onClick={save} style={{ background:"linear-gradient(135deg,#2563EB,#3B82F6)",color:"#fff",border:"none",borderRadius:9,padding:"0 16px",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap" }}>
                    Save Key
                  </button>
                </div>
                <p style={{ fontSize:11,color:C.dim,margin:0,lineHeight:1.5 }}>
                  {hint} Get one at <a href={link} target="_blank" style={{ color:C.accent2 }}>{linkLabel}</a>.
                </p>
              </Glass>
            );
          };

          return (
            <div style={{ display:"flex",flexDirection:"column",gap:14,maxWidth:570 }}>

              {/* Status banner */}
              <Glass style={{ padding:"13px 17px",display:"flex",alignItems:"center",gap:12,
                background: hasGemini||hasClaude ? "rgba(16,185,129,0.07)" : "rgba(245,158,11,0.07)",
                border:`1px solid ${hasGemini||hasClaude?"rgba(16,185,129,0.25)":"rgba(245,158,11,0.25)"}` }}>
                <Icon d={hasGemini||hasClaude ? IC.check : IC.alertCircle} size={18}
                  stroke={hasGemini||hasClaude ? "#10B981" : "#F59E0B"}/>
                <div>
                  <div style={{ fontSize:13,fontWeight:700,color:hasGemini||hasClaude?"#10B981":"#FBBF24" }}>
                    {hasGemini ? "Gemini active — free & ready" : hasClaude ? "Claude active" : "No AI key yet"}
                  </div>
                  <div style={{ fontSize:11,color:C.dim,marginTop:2 }}>
                    {hasGemini && hasClaude ? "Gemini is used first (free). Claude is the fallback if Gemini fails." :
                     hasGemini             ? "Auto-detect is live. Upload any template and fields snap in automatically." :
                     hasClaude             ? "Auto-detect uses Claude. Add a free Gemini key below to save money." :
                                             "Add a Gemini key below (free) to enable AI field auto-detection."}
                  </div>
                </div>
              </Glass>

              {/* Gemini card — recommended, free */}
              <KeyCard
                title="Google Gemini" badge="Recommended" badgeColor="#10B981" isFree={true}
                storageKey={GEMINI_KEY_STORAGE} curValue={geminiKey} setStateFn={setGeminiKeyState}
                placeholder="AIzaSy…"
                hint="Free tier — 1,500 requests/day, no credit card needed."
                link="https://aistudio.google.com/apikey" linkLabel="aistudio.google.com"
              />

              {/* Claude card — paid fallback */}
              <KeyCard
                title="Anthropic Claude" badge="Fallback" badgeColor="#8B5CF6" isFree={false}
                storageKey={CLAUDE_KEY_STORAGE} curValue={claudeKey} setStateFn={setClaudeKeyState}
                placeholder="sk-ant-api03-…"
                hint="Paid (~$0.01–0.03 per scan). New accounts get $5 free credit."

              {/* How it works */}
              <Glass style={{ padding:20 }}>
                <h4 style={{ fontFamily:"'Sora',sans-serif",fontSize:13,fontWeight:700,color:"#fff",margin:"0 0 12px" }}>How Auto-Detect Works</h4>
                {[
                  ["#3B82F6","1","Upload any template — blank or already filled with real data (e.g. a real driver license photo with name, DOB, photo already on it)"],
                  ["#8B5CF6","2","Gemini or Claude Vision reads the layout and pinpoints every personal data field with its exact position on the card"],

                  ["#F59E0B","4","Drag to fine-tune any field, resize the box, adjust font size/color — then Save and it's live for users"],

                    <div style={{ fontSize:12,color:C.dim,lineHeight:1.55,paddingTop:3 }}>{text}</div>
                  </div>
                ))}
              </Glass>
            </div>
          );
        })()}

        {!loading && section==="users" && (
          users.length===0 ? (
            <Glass style={{ padding:32,textAlign:"center" }}><p style={{ color:C.dim,fontSize:14 }}>No users in Firestore yet.</p></Glass>
          ) : (
            <Glass style={{ padding:0,overflow:"auto" }}>
              <table style={{ width:"100%",borderCollapse:"collapse",minWidth:640 }}>
                <thead><tr style={{ borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
                  {["Name","Email","Plan","Generations","Joined"].map(h=>(
                    <th key={h} style={{ padding:"12px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>{users.map(u=>(
                  <tr key={u.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{u.displayName||"—"}</td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{u.email}</td>
                    <td style={{ padding:"11px 16px" }}><Badge color={C.accent2}>{u.plan||"free"}</Badge></td>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{u.totalGenerations||0}</td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{u.createdAt?.seconds?new Date(u.createdAt.seconds*1000).toLocaleDateString():"—"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </Glass>
          )
        )}

        {!loading && section==="orders" && (
          gens.length===0 ? (
            <Glass style={{ padding:32,textAlign:"center" }}><p style={{ color:C.dim,fontSize:14 }}>No orders yet.</p></Glass>
          ) : (
            <Glass style={{ padding:0,overflow:"auto" }}>
              <table style={{ width:"100%",borderCollapse:"collapse",minWidth:640 }}>
                <thead><tr style={{ borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
                  {["Document","User ID","Status","Date"].map(h=>(
                    <th key={h} style={{ padding:"12px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>{gens.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(g=>(
                  <tr key={g.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                    <td style={{ padding:"11px 16px",fontSize:13,color:"#fff" }}>{g.templateName||"—"}</td>
                    <td style={{ padding:"11px 16px",fontSize:11,color:C.dim,fontFamily:"monospace" }}>{g.userId?.slice(0,12)}…</td>
                    <td style={{ padding:"11px 16px" }}><Badge color={g.purchased?"#10B981":"#F59E0B"}>{g.purchased?"Purchased":"Preview"}</Badge></td>
                    <td style={{ padding:"11px 16px",fontSize:12,color:C.dim }}>{g.createdAt?.seconds?new Date(g.createdAt.seconds*1000).toLocaleDateString():"—"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </Glass>
          )
        )}
      </div>
    </div>
  );
};

  { label:"Hair Color",       type:"select",    w:0.14, h:0.050, fontSize:0.024, fontColor:"#111111", align:"left", options:["BLK","BRN","BLD","RED","GRY","WHT"] },
