const FIELD_COLORS = {
  text:"#3B82F6", date:"#8B5CF6", select:"#F59E0B",
  photo:"#10B981", signature:"#EC4899", textarea:"#06B6D4", image:"#10B981",
};

const TemplateEditor = ({ editor, setEditor, onPickImage, updateField, removeField, addField, saveTemplate, saving, showToast, autoDetectPending, setAutoDetectPending }) => {
  const wrapRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(null);
  const [selectedField, setSelectedField] = React.useState(null);
  const [pendingField, setPendingField] = React.useState(null); // quick-field waiting to be placed
  const [imgH, setImgH] = React.useState(0);
  const [detecting, setDetecting] = React.useState(false);

  // Auto-detect fields using AI (Gemini free first, Claude fallback)
  const runClaudeDetect = React.useCallback(async (imageDataURL) => {
    if (!imageDataURL) return;
    setDetecting(true);
    try {
      const fields = await detectFieldsAI(imageDataURL);
      const provider = getGeminiKey() ? "Gemini" : "Claude";
      setEditor(e => ({ ...e, fields }));
      if (showToast) showToast(provider + " detected " + fields.length + " fields — drag to fine-tune!", "success");
    } catch (err) {
      if (showToast) showToast("AI detect failed: " + err.message, "error");
    }
    setDetecting(false);
  }, [setEditor, showToast]);

  // Fire when AdminPanel passes a new image to auto-detect
  React.useEffect(() => {
    if (!autoDetectPending) return;
    setAutoDetectPending(null);
    runClaudeDetect(autoDetectPending);
  }, [autoDetectPending]);

  // Track rendered image height for font size calc
  const imgRef = React.useCallback(node => {
    if (!node) return;
    const ro = new ResizeObserver(e => setImgH(e[0].contentRect.height));
    ro.observe(node);
  }, []);

  // Drag to move / resize existing field boxes
  const onMouseDown = (e, i, mode) => {
    e.preventDefault(); e.stopPropagation();
    setSelectedField(i);
    const rect = wrapRef.current.getBoundingClientRect();
    setDragging({ i, mode, startX:e.clientX, startY:e.clientY, rect, orig:{...editor.fields[i]} });
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onMove = (e) => {
      const dx = (e.clientX - dragging.startX) / dragging.rect.width;
      const dy = (e.clientY - dragging.startY) / dragging.rect.height;
      if (dragging.mode === "move") {
        updateField(dragging.i, {
          x: Math.max(0, Math.min(1 - dragging.orig.w, dragging.orig.x + dx)),
          y: Math.max(0, Math.min(1 - dragging.orig.h, dragging.orig.y + dy)),
        });
      } else {
        updateField(dragging.i, {
          w: Math.max(0.02, Math.min(1 - dragging.orig.x, dragging.orig.w + dx)),
          h: Math.max(0.01, Math.min(1 - dragging.orig.y, dragging.orig.h + dy)),
        });
      }
    };
    const onUp = () => setDragging(null);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [dragging]);

  // Click on image to place pending field
  const onImageClick = (e) => {
    if (dragging) return;
    if (!pendingField) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(1 - pendingField.w, (e.clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1 - (pendingField.h || 0.05), (e.clientY - rect.top) / rect.height));
    const newField = {
      id: slugify(pendingField.label),
      label: pendingField.label,
      type: pendingField.type,
      options: pendingField.options,
      x, y,
      w: pendingField.w,
      h: pendingField.h,
      fontSize: pendingField.fontSize || 0.025,
      fontColor: pendingField.fontColor || "#111111",
      align: pendingField.align || "left",
      placeholder: pendingField.label,
    };
    setEditor(s => ({ ...s, fields: [...s.fields, newField] }));
    setSelectedField(editor.fields.length);
    setPendingField(null);
  };

  const fieldColor = (type) => FIELD_COLORS[type] || "#3B82F6";

  return (
    <div>
      <style>{`
        @media(max-width:960px){.te-grid{grid-template-columns:1fr!important}}
        .qf-btn{transition:all .15s;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#D1D5DB;border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
        .qf-btn:hover{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:#fff;}
        .qf-btn.active{background:rgba(59,130,246,0.25);border-color:#3B82F6;color:#fff;}
        .field-row{border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:9px 10px;cursor:pointer;transition:all .15s;}
        .field-row:hover{border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.05);}
        .field-row.sel{border-color:#3B82F6;background:rgba(59,130,246,0.1);}
      `}</style>

      {/* Top bar: template name + category */}
      <Glass style={{ padding:"14px 18px", marginBottom:14, display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end" }}>
        <div style={{ flex:2, minWidth:200 }}>
          <span style={{ fontSize:11,fontWeight:600,color:C.dim,display:"block",marginBottom:5 }}>TEMPLATE NAME</span>
          <input value={editor.name} onChange={e=>setEditor(s=>({...s,name:e.target.value}))} placeholder="e.g. Texas Driver's License"
            style={{ ...iStyle, padding:"9px 12px", fontSize:14, fontWeight:600 }}/>
        </div>
        <div style={{ flex:1, minWidth:150 }}>
          <span style={{ fontSize:11,fontWeight:600,color:C.dim,display:"block",marginBottom:5 }}>CATEGORY</span>
          <select value={editor.catId} onChange={e=>{ const c=CATEGORIES.find(x=>x.id===e.target.value); setEditor(s=>({...s,catId:c.id,category:c.name,color:c.color})); }} style={{ ...iStyle, padding:"9px 12px" }}>
            {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <Btn variant="success" onClick={saveTemplate} disabled={saving} style={{ padding:"9px 20px", flexShrink:0 }}>
          {saving?<><Spinner size={14}/> Saving…</>:<><Icon d={IC.check} size={14}/> Save Template</>}
        </Btn>
      </Glass>

      <div style={{ display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:14 }} className="te-grid">

        {/* LEFT: image canvas */}
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {/* Upload + quick-field palette */}
          <Glass style={{ padding:14 }}>
            <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap", alignItems:"center" }}>
              <label style={{ background:"rgba(255,255,255,0.05)",border:"1px dashed rgba(255,255,255,0.15)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,color:C.muted,display:"flex",alignItems:"center",gap:6 }}>
                <Icon d={IC.upload} size={13} stroke={C.accent2}/> {editor.imageURL?"Replace Image":"Upload Template Image"}
                <input type="file" accept="image/*" style={{ display:"none" }} onChange={e=>onPickImage(e.target.files[0])}/>
              </label>
              {editor.imageURL && !detecting && (
                <button onClick={()=>runClaudeDetect(editor.imageURL)} title="Let Claude AI analyze the image and auto-place fields"
                  style={{ background:"linear-gradient(135deg,rgba(139,92,246,0.25),rgba(59,130,246,0.2))",border:"1px solid rgba(139,92,246,0.5)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,color:"#C4B5FD",display:"flex",alignItems:"center",gap:6,fontFamily:"inherit" }}>
                  <Icon d={IC.zap} size={13} stroke="#C4B5FD"/> Auto-detect Fields (AI)
                </button>
              )}
              {detecting && (
                <div style={{ display:"flex",alignItems:"center",gap:8,background:"rgba(139,92,246,0.15)",border:"1px solid rgba(139,92,246,0.35)",borderRadius:8,padding:"7px 14px",fontSize:12,color:"#C4B5FD" }}>
                  <Spinner size={13}/> Claude is analyzing your template…
                </div>
              )}
              {!getGeminiKey() && !getClaudeKey() && editor.imageURL && (
                <div style={{ fontSize:11,color:"#FBBF24",background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:7,padding:"5px 10px",display:"flex",alignItems:"center",gap:5 }}>
                  <Icon d={IC.alertCircle} size={12} stroke="#FBBF24"/> Add a free Gemini key (Admin → AI Key) to enable auto-detect
                </div>
              )}
              {pendingField && (
                <div style={{ display:"flex",alignItems:"center",gap:8,background:"rgba(59,130,246,0.15)",border:"1px solid #3B82F6",borderRadius:8,padding:"7px 12px",fontSize:12,color:"#93C5FD" }}>
                  <Icon d={IC.zap} size={13} stroke="#93C5FD"/>
                  Click image to place <strong style={{color:"#fff"}}>{pendingField.label}</strong>
                  <button onClick={()=>setPendingField(null)} style={{ background:"none",border:"none",cursor:"pointer",color:"#F87171",marginLeft:4,fontSize:16,lineHeight:1 }}>×</button>
                </div>
              )}
            </div>
            <div style={{ marginBottom:6 }}>
              <span style={{ fontSize:11,fontWeight:600,color:C.dim,letterSpacing:"0.06em" }}>QUICK-ADD FIELDS — click a field then click its position on the image</span>
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
              {QUICK_FIELDS.map((qf,i) => (
                <button key={i} className={"qf-btn"+(pendingField?.label===qf.label?" active":"")}
                  onClick={()=>setPendingField(pendingField?.label===qf.label ? null : qf)}>
                  <span style={{ width:8,height:8,borderRadius:"50%",background:fieldColor(qf.type),display:"inline-block",flexShrink:0 }}/>
                  {qf.label}
                </button>
              ))}
            </div>
          </Glass>

          {/* Image with field overlays */}
          <Glass style={{ padding:10 }}>
            {editor.imageURL ? (
              <div ref={wrapRef} onClick={onImageClick}
                style={{ position:"relative", width:"100%", borderRadius:8, overflow:"hidden",
                  border: pendingField ? "2px solid #3B82F6" : "1px solid rgba(255,255,255,0.08)",
                  cursor: pendingField ? "crosshair" : "default", userSelect:"none" }}>
                <img ref={imgRef} src={editor.imageURL} alt="template" style={{ width:"100%", display:"block", pointerEvents:"none" }} draggable={false}/>
                {editor.fields.map((f,i) => {
                  const color = fieldColor(f.type);
                  const isSelected = selectedField === i;
                  const fs = Math.max(7, (f.fontSize||0.025) * imgH);
                  return (
                    <div key={i} onMouseDown={e=>onMouseDown(e,i,"move")} onClick={e=>{e.stopPropagation();setSelectedField(i);}}
                      style={{ position:"absolute", left:(f.x*100)+"%", top:(f.y*100)+"%", width:(f.w*100)+"%", height:(f.h*100)+"%",
                        border:`2px solid ${color}`, background:isSelected?`${color}30`:`${color}18`,
                        cursor:"move", boxSizing:"border-box",
                        outline: isSelected ? `2px solid ${color}` : "none", outlineOffset:1 }}>
                      <div style={{ position:"absolute", top:-19, left:-1, fontSize:9, background:color, color:"#fff", padding:"2px 6px", borderRadius:"3px 3px 3px 0", whiteSpace:"nowrap", fontWeight:700, maxWidth:120, overflow:"hidden", textOverflow:"ellipsis" }}>
                        {f.label}
                      </div>
                      {/* Resize handle */}
                      <div onMouseDown={e=>onMouseDown(e,i,"resize")}
                        style={{ position:"absolute", right:-5, bottom:-5, width:12, height:12, background:color, borderRadius:2, cursor:"nwse-resize", zIndex:2 }}/>
                      {/* Sample preview text inside box */}
                      {!["photo","signature","image"].includes(f.type) && (
                        <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center",
                          justifyContent: f.align==="center"?"center":f.align==="right"?"flex-end":"flex-start",
                          padding:"0 3px", pointerEvents:"none", overflow:"hidden" }}>
                          {f.prefix && (
                            <span style={{ fontSize:fs+"px", color:f.fontColor||"#111", fontFamily:"'Sora',sans-serif", fontWeight:400, whiteSpace:"nowrap", opacity:0.35, marginRight:2 }}>
                              {f.prefix}
                            </span>
                          )}
                          <span style={{ fontSize:fs+"px", color:f.fontColor||"#111", fontFamily:"'Sora',sans-serif", fontWeight:600, whiteSpace:"nowrap", opacity:0.65 }}>
                            {f.label}
                          </span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div style={{ minHeight:280, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", border:"2px dashed rgba(255,255,255,0.1)", borderRadius:10, gap:10, color:C.dim }}>
                <Icon d={IC.upload} size={36} stroke={C.dim}/>
                <div style={{ fontSize:13 }}>Upload a template image to start placing fields</div>
              </div>
            )}
          </Glass>
        </div>

        {/* RIGHT: field list */}
        <Glass style={{ padding:14, maxHeight:"82vh", overflow:"auto", display:"flex", flexDirection:"column", gap:10 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
            <h4 style={{ fontFamily:"'Sora',sans-serif", fontSize:13, fontWeight:700, color:"#fff", margin:0 }}>
              Fields <span style={{ color:C.dim, fontWeight:400 }}>({editor.fields.length})</span>
            </h4>
            <button onClick={()=>{ addField(); setSelectedField(editor.fields.length); }}
              style={{ background:"rgba(59,130,246,0.15)",border:"1px solid rgba(59,130,246,0.3)",color:"#93C5FD",borderRadius:7,padding:"4px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit" }}>
              + Blank Field
            </button>
          </div>

          {!editor.fields.length && (
            <div style={{ textAlign:"center", padding:"30px 10px", color:C.dim, fontSize:12, border:"1px dashed rgba(255,255,255,0.08)", borderRadius:8 }}>
              Click a quick-add field above,<br/>then click its position on the image.
            </div>
          )}

          {editor.fields.map((f,i) => (
            <div key={i} className={"field-row"+(selectedField===i?" sel":"")} onClick={()=>setSelectedField(selectedField===i?null:i)}
              style={{ background: selectedField===i?"rgba(59,130,246,0.08)":"rgba(255,255,255,0.02)" }}>
              {/* Field header row */}
              <div style={{ display:"flex", gap:6, alignItems:"center", marginBottom: selectedField===i?8:0 }}>
                <span style={{ width:9,height:9,borderRadius:"50%",background:fieldColor(f.type),display:"inline-block",flexShrink:0 }}/>
                <span style={{ fontSize:12,fontWeight:600,color:"#fff",flex:1 }}>{f.label||"Unnamed"}</span>
                <span style={{ fontSize:10,color:C.dim,background:"rgba(255,255,255,0.05)",padding:"2px 6px",borderRadius:4 }}>{f.type}</span>
                <button onClick={e=>{e.stopPropagation();removeField(i);if(selectedField===i)setSelectedField(null);}}
                  style={{ background:"none",border:"none",cursor:"pointer",color:"#F87171",fontSize:15,lineHeight:1,padding:"0 2px" }}>×</button>
              </div>

              {/* Expanded edit form when selected */}
              {selectedField===i && (
                <div onClick={e=>e.stopPropagation()} style={{ display:"flex",flexDirection:"column",gap:7,paddingTop:4 }}>
                  <div style={{ display:"flex",gap:6 }}>
                    <input value={f.label} onChange={e=>updateField(i,{label:e.target.value,id:slugify(e.target.value)})}
                      placeholder="Label" style={{ ...iStyle,padding:"6px 8px",fontSize:12,flex:1 }}/>
                    <select value={f.type} onChange={e=>updateField(i,{type:e.target.value})}
                      style={{ ...iStyle,padding:"6px 8px",fontSize:12,width:110 }}>
                      {["text","date","select","textarea","photo","signature"].map(t=><option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                  {f.type==="select" && (
                    <input value={(f.options||[]).join(", ")} onChange={e=>updateField(i,{options:e.target.value.split(",").map(s=>s.trim()).filter(Boolean)})}
                      placeholder="Option1, Option2, …" style={{ ...iStyle,padding:"6px 8px",fontSize:12 }}/>
                  )}
                  {/* Position & size */}
                  <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:5 }}>
                    {[["X",f.x||0,"x",0.01],["Y",f.y||0,"y",0.01],["W",f.w||0.2,"w",0.01],["H",f.h||0.04,"h",0.005]].map(([lbl,val,key,step])=>(
                      <label key={key} style={{ fontSize:10,color:C.dim }}>
                        {lbl} <input type="number" step={step} min="0" max="1" value={val.toFixed(3)}
                          onChange={e=>updateField(i,{[key]:+e.target.value})}
                          style={{ ...iStyle,padding:"4px 5px",fontSize:11 }}/>
                      </label>
                    ))}
                  </div>
                  {!["photo","signature","image"].includes(f.type) && (
                    <>
                    <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5 }}>
                      <label style={{ fontSize:10,color:C.dim }}>Font size
                        <input type="number" step="0.002" min="0.008" max="0.15" value={(f.fontSize||0.025).toFixed(3)}
                          onChange={e=>updateField(i,{fontSize:+e.target.value})}
                          style={{ ...iStyle,padding:"4px 5px",fontSize:11 }}/>
                      </label>
                      <label style={{ fontSize:10,color:C.dim }}>Color
                        <input type="color" value={f.fontColor||"#111111"} onChange={e=>updateField(i,{fontColor:e.target.value})}
                          style={{ width:"100%",height:28,padding:0,border:"1px solid rgba(255,255,255,0.1)",borderRadius:4,background:"transparent" }}/>
                      </label>
                      <label style={{ fontSize:10,color:C.dim }}>Align
                        <select value={f.align||"left"} onChange={e=>updateField(i,{align:e.target.value})}
                          style={{ ...iStyle,padding:"4px 5px",fontSize:11 }}>
                          {["left","center","right"].map(a=><option key={a} value={a}>{a}</option>)}
                        </select>
                      </label>
                    </div>
                    <label style={{ fontSize:10,color:C.dim }}>
                      Label prefix <span style={{fontWeight:400,opacity:0.7}}>(optional — e.g. "DOB: " printed before the user's value)</span>
                      <input value={f.prefix||""} onChange={e=>updateField(i,{prefix:e.target.value})}
                        placeholder='e.g. "4d. DL: " or "DOB: " — leave blank if card already has the label printed'
                        style={{ ...iStyle,padding:"5px 7px",fontSize:11 }}/>
                    </label>
                    </>
                  )}
                </div>
              )}
            </div>
          ))}
        </Glass>
      </div>
    </div>
  );
};

// ─── Session persistence helpers ──────────────────────────────────────────────
const SS_PAGE = "proofit_page";
const SS_TMPL = "proofit_selected_template";
const publicPages = new Set(["landing","login","register"]);

function readPersistedPage() {
  try { return sessionStorage.getItem(SS_PAGE) || "landing"; } catch { return "landing"; }
}
function writePersistedPage(p) {
  try { sessionStorage.setItem(SS_PAGE, p); } catch {}
}
function readPersistedTemplate() {
  try { const s = sessionStorage.getItem(SS_TMPL); return s ? JSON.parse(s) : null; } catch { return null; }
}
function writePersistedTemplate(t) {
  try {
    if (t) sessionStorage.setItem(SS_TMPL, JSON.stringify(t));
    else sessionStorage.removeItem(SS_TMPL);
  } catch {}
}

// ─── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const [fb, setFb] = useState(null);
  const [fbReady, setFbReady] = useState(false);
  const [fbError, setFbError] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  // Restore page from sessionStorage so reload lands on the same screen
  const [page, setPageState] = useState(() => readPersistedPage());
  // Restore selected template so template-detail / generated survive reload
  const [selectedTemplate, setSelectedTemplateState] = useState(() => readPersistedTemplate());
  const [toast, setToast] = useState(null);
  const [customTemplates, setCustomTemplates] = useState([]);

  // Wrap setPage so every navigation is also persisted
  const setPage = useCallback((p) => {
    writePersistedPage(p);
    setPageState(p);
  }, []);

  // Wrap setSelectedTemplate so it is also persisted
  const setSelectedTemplate = useCallback((t) => {
    writePersistedTemplate(t);
    setSelectedTemplateState(t);
  }, []);

  useEffect(() => {
    loadFirebase(FIREBASE_CONFIG).then(instance => {
      setFb(instance); setFbReady(true);
      instance.onAuthStateChanged(u => {
        setAuthUser(u);
        setAuthLoading(false);
        if (!u) {
          // User is logged out — redirect away from protected pages
          const current = readPersistedPage();
          if (!publicPages.has(current)) {
            writePersistedPage("landing");
            setPageState("landing");
          }
        }
        // If user IS logged in, leave whatever page they were on intact
      });
    }).catch(e => { setFbError(e.message || "Unknown error"); setAuthLoading(false); });
  }, []);

  const reloadTemplates = useCallback(async () => {
    if (!fb) return;
    try {
      const snap = await fb.getDocs(fb.collection(fb.db,"customTemplates"));
      setCustomTemplates(snap.docs.map(d => ({ ...d.data(), _docId: d.id })));
    } catch (e) { console.warn("Load templates failed", e); }
  }, [fb]);

  useEffect(() => { if (fbReady) reloadTemplates(); }, [fbReady, reloadTemplates]);

  // Built-in templates overridden by any custom row with matching id, plus brand-new custom rows.
  // BUILTIN_IMAGES provides pre-embedded template images for built-in templates.
  const mergedTemplates = (() => {
    const customById = Object.fromEntries(customTemplates.map(t => [t.id, t]));
    const overridden = ALL_TEMPLATES.map(t => {
      const custom = customById[t.id];
      const builtinImage = BUILTIN_IMAGES[t.id];
      const merged = custom ? { ...t, ...custom } : { ...t };
      if (builtinImage && !merged.imageURL) merged.imageURL = builtinImage;
      return merged;
    });
    const newOnes = customTemplates.filter(t => !ALL_TEMPLATES.find(b => b.id === t.id));
    return [...overridden, ...newOnes];
  })();

  const showToast = (msg, type="success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const logout = async () => {
    await fb?.logout();
    setAuthUser(null);
    writePersistedPage("landing");
    writePersistedTemplate(null);
    setPageState("landing");
    setSelectedTemplateState(null);
    showToast("Signed out.", "warning");
  };

  const isAdmin = !!(authUser?.email && authUser.email.toLowerCase() === ADMIN_EMAIL);

  const navSetPage = (p) => {
    if ((p==="dashboard"||p==="template-detail"||p==="generated") && !authUser) { setPage("login"); return; }
    if (p==="admin" && !isAdmin) { showToast("Access denied. Admin only.","error"); return; }
    setPage(p);
  };

  // Re-hydrate selectedTemplate from mergedTemplates after reload (so imageURL etc. are fresh)
  const liveTemplate = selectedTemplate
    ? (mergedTemplates.find(t => t.id === selectedTemplate.id) || selectedTemplate)
    : null;

  if (!fbReady) return <LoadingScreen error={fbError} />;
  if (authLoading) return (
    <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg0 }}>
      <Spinner size={40} />
    </div>
  );

  const pageProps = { fb, authUser, showToast, setPage:navSetPage };

  return (
    <div style={{ minHeight:"100vh", background:`linear-gradient(160deg,${C.bg0} 0%,${C.bg1} 50%,${C.bg0} 100%)`,
      color:"#fff", fontFamily:"'Sora',system-ui,sans-serif", position:"relative" }}>
      <AnimBg />
      <div style={{ position:"relative", zIndex:1 }}>
        <Nav page={page} setPage={navSetPage} authUser={authUser} onLogout={logout} />
        {page==="landing" && <Landing setPage={navSetPage} />}
        {page==="login" && <AuthPage mode="login" {...pageProps} onAuth={setAuthUser} />}
        {page==="register" && <AuthPage mode="register" {...pageProps} onAuth={setAuthUser} />}
        {page==="dashboard" && <Dashboard {...pageProps} setSelectedTemplate={setSelectedTemplate} templates={mergedTemplates} />}
        {page==="template-detail" && <TemplateDetail template={liveTemplate} {...pageProps} />}
        {page==="generated" && <GeneratedPreview template={liveTemplate} {...pageProps} />}
        {page==="admin" && isAdmin && <AdminPanel {...pageProps} customTemplates={customTemplates} reloadTemplates={reloadTemplates} />}
      </div>
      {isAdmin && (
        <button onClick={()=>navSetPage("admin")} title="Admin Panel"
          style={{ position:"fixed",bottom:20,right:20,width:36,height:36,borderRadius:"50%",
            background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.2)",
            cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:99 }}>
          <Icon d={IC.settings} size={16} stroke="#F87171" />
        </button>
      )}
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
